# Manual, dispatch-only release automation (replaces the Stainless-run
# release-please after the platform sunset on 2026-09-01).
#
# A maintainer runs this workflow (Actions -> Release -> Run workflow) and
# picks the bump: patch / minor / major. The workflow then, in one shot:
#   0. runs the V1 + V2 production e2e suite (.github/workflows/e2e-production.yml)
#      against the live API — nothing below runs if it goes red,
#   1. computes the next version from the latest git tag,
#   2. stamps it into package.json and src/version.ts,
#   3. prepends a changelog section (grouped by Conventional Commit prefixes)
#      to CHANGELOG.md,
#   4. builds and tests the stamped tree — the release aborts here, before
#      any commit or tag exists, if anything is red,
#   5. lands that as a "release: x.y.z" commit directly on main,
#   6. tags it and creates the GitHub Release, which triggers
#      .github/workflows/publish-npm.yml (root package).
#
# Both gates (0 and 4) sit before any commit, tag, or GitHub Release exists, so
# an aborted release leaves no trace to clean up. Note the trade-off in gate 0:
# a production API outage blocks releasing. That is intentional — shipping an
# SDK whose live surface is broken is worse — but it does mean an urgent release
# during an incident needs gate 0 temporarily removed from this file.
#
# No release PR, no second confirmation: dispatching the workflow IS the
# release decision. Ordinary PR merges never trigger any of this.
#
# RELEASE_TOKEN requirements:
#   - a fine-grained PAT (or GitHub App installation token) with
#     Contents: write on this repository;
#   - its owner must be able to bypass the main-branch ruleset (the ruleset
#     requires PRs; this repo's ruleset grants "always" bypass to the
#     repository Admin role). Otherwise the direct push in step 4 is rejected.
#   - The default GITHUB_TOKEN cannot be used: releases it creates do not
#     trigger other workflows, so publishing would silently never run.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this release'
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

# Only one release can run at a time; a second dispatch queues rather than
# racing the version computation and the push to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate the release on the live production API before anything is stamped or tagged.
  # `secrets: inherit` hands the called workflow LANDINGAI_ADE_PRODUCTION_APIKEY; it
  # fails fast if that secret is missing rather than passing with zero tests run.
  e2e-production:
    name: e2e gate
    if: github.repository == 'landing-ai/ade-typescript' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-production.yml
    secrets: inherit

  release:
    name: release
    runs-on: ubuntu-latest
    # A skipped or failed gate skips the release too, so there is no path to a tag
    # that did not pass production e2e.
    needs: e2e-production
    if: github.repository == 'landing-ai/ade-typescript' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: needed for the previous tag + changelog range
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          prev_tag="$(git describe --tags --abbrev=0)"
          current="${prev_tag#v}"
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "bumping $current -> $next ($BUMP)"
          {
            echo "prev_tag=$prev_tag"
            echo "version=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp version
        env:
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'package.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.version = process.env.NEXT;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          "
          sed -i -E "s/export const VERSION = '.*'/export const VERSION = '$NEXT'/" src/version.ts
          git diff --stat

      - name: Update changelog
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            "${{ github.repository }}" "$PREV_TAG" "$NEXT" > /tmp/release-notes.md
          { head -n 2 CHANGELOG.md; cat /tmp/release-notes.md; echo; tail -n +3 CHANGELOG.md; } > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build and test the stamped tree
        run: |
          ./scripts/bootstrap
          ./scripts/build
          ./scripts/test

      - name: Commit, tag, and create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.ts CHANGELOG.md
          git commit -m "release: $NEXT"
          git push origin HEAD:main
          gh release create "v$NEXT" \
            --target "$(git rev-parse HEAD)" \
            --title "v$NEXT" \
            --notes-file /tmp/release-notes.md
