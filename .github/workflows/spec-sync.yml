name: Spec Sync
on:
  schedule:
    - cron: '0 * * * *' # hourly; cron covers correctness, dispatch cuts latency
  workflow_dispatch: {}

# Serialize runs so a cron tick and a manual dispatch can't race on the sync branch.
concurrency:
  group: spec-sync
  cancel-in-progress: false

permissions:
  contents: read # all writes go through SPEC_SYNC_TOKEN, never GITHUB_TOKEN

jobs:
  # V1 loop. Tracks the staging V1 ADE spec (staging drives sync; production gates release). On
  # drift it opens ONE PR on a fixed branch with two attributed commits: a deterministic mechanical
  # commit (snapshot + regenerated reference types) and an AI commit (SDK wiring). Both are gated by
  # .github/workflows/pr-gates.yml and require human review before merge.
  #
  # Incorporates ade-python's later hardening from the start: the open-PR check fails CLOSED, the AI
  # step has NO shell, and a trusted step enforces a product-code allowlist before running any tool.
  spec-sync:
    # Guard so the scheduled/dispatch job only runs on the canonical repo — forks lack the secrets
    # and would just produce noisy failing runs.
    if: github.repository == 'landing-ai/ade-typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # headroom for the AI wiring step (up to --max-turns 250) plus install/build
    env:
      V1_SPEC_URL: https://api.va.staging.landing.ai/v1/ade/openapi.json # staging drives the loop
      SYNC_BRANCH: spec-sync/v1 # fixed branch: reruns update one PR in place, never a pile of them
      SPEC_LABEL: V1 # used only in Slack/PR-comment copy to disambiguate the two jobs
    steps:
      - uses: actions/checkout@v6
        with:
          # SPEC_SYNC_TOKEN is a fine-grained PAT (Contents: RW, Pull requests: RW) scoped to this
          # repo. It must NOT be the default GITHUB_TOKEN: pushes/PRs authored by GITHUB_TOKEN do
          # not trigger the gate workflows (anti-recursion), so the gates would never run on the PR.
          token: ${{ secrets.SPEC_SYNC_TOKEN }}
          fetch-depth: 0 # tags needed for the surface-lock baseline

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Detect drift
        id: drift
        run: |
          set +e
          ./scripts/spec-sync/check-drift.sh "$V1_SPEC_URL" specs/v1-ade.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: No drift
        if: steps.drift.outputs.code == '0'
        run: echo "specs in sync; nothing to do."

      # An unavailable spec source (check-drift exit 20) is the EXPECTED case on staging, not an
      # incident: staging auto-reclaims and must be booked to come back — an unbooked cluster serves a
      # 404 (or the host stops answering entirely). Treat ONLY this as a no-op — log and end the run
      # cleanly (no drift, no PR, no Slack); the next hourly run picks up any drift once staging is
      # booked. Every other failure (a reachable source returning 401/403/5xx, an empty/invalid spec,
      # or a script error) falls through to "Fail on spec error" below and alerts.
      - name: Spec source unavailable — skip
        if: steps.drift.outputs.code == '20'
        run: echo "spec source unavailable (exit 20); staging is likely unbooked — skipping this run."

      # A reachable-but-invalid spec (empty/whitespace body, malformed JSON) or a script error is a
      # real problem — fail loudly so the catch-all alert fires. Distinct from the exit-20 skip above.
      - name: Fail on spec error
        if: steps.drift.outputs.code != '0' && steps.drift.outputs.code != '10' && steps.drift.outputs.code != '20'
        run: |
          echo "spec fetch/normalize failed (exit ${{ steps.drift.outputs.code }}); staging was reachable but returned an error status (401/403/5xx), an empty/invalid spec, or a script errored."
          exit 1

      - name: Check for an open sync PR
        id: existing
        if: steps.drift.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: |
          # Fail CLOSED: capture the query result separately so a transient gh/API failure aborts
          # the job (a failure inside an `if` condition is exempt from set -e, which would silently
          # become open=false and force-push over an existing human-reviewed PR's branch).
          count="$(gh pr list --state open --head "$SYNC_BRANCH" --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      # A sync PR is already open. Every hourly tick still reports drift (check-drift compares against
      # main, not the PR branch), so instead of a bare skip: detect drift that appeared BEYOND the
      # open PR and, if any, annotate the PR + emit one Slack ping per distinct new spec (deduped).
      - name: New drift behind the open PR
        id: behind
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: ./scripts/spec-sync/notify-new-drift.sh specs/v1-ade.json "$SYNC_BRANCH" "$SPEC_LABEL"

      - name: Slack — new drift behind the open PR
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open == 'true' && steps.behind.outputs.notify == 'true'
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: warning
          title: 'spec-sync ${{ env.SPEC_LABEL }}: new drift behind the open PR'
          text: 'New ${{ env.SPEC_LABEL }} spec drift appeared beyond the <${{ steps.behind.outputs.pr_url }}|open sync PR> (live-spec `${{ steps.behind.outputs.hash }}`). Merge or close it and the next run opens a fresh one covering the rest.'
          thread_ts: ${{ steps.behind.outputs.thread_ts }}

      # ---- Phase 1: mechanical (deterministic) ----
      - name: Mechanical commit + push
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git config user.name "spec-sync[bot]"
          git config user.email "spec-sync@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          ./scripts/spec-sync/gen-models.sh specs/v1-ade.json specs/_generated/v1-ade.d.ts
          git add specs/v1-ade.json specs/_generated/v1-ade.d.ts
          git commit -m "chore(spec-sync): update V1 spec snapshot + regenerated reference types"
          git push --force origin "$SYNC_BRANCH"

      # Open the PR now — before the AI step — so a run that dies in phase 2 leaves a visible PR
      # (with just the mechanical commit) instead of an orphan branch.
      - name: Open sync PR
        id: open_pr
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: |
          url="$(gh pr create --base main --head "$SYNC_BRANCH" \
            --title "spec-sync: track V1 spec drift" \
            --body $'Automated spec-sync PR.\n\n- **Commit 1 (mechanical):** normalized spec snapshot + regenerated reference types.\n- **Commit 2 (AI):** resources/methods/tests/docs wired from the spec diff (added after this PR opened).\n\nGates (surface-lock, contract tests, lint/build/test) must pass. **Human review required before merge.**')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Post the Slack thread ROOT now — right after the PR exists, before AI wiring — so every later
      # event (AI outcome, new drift, gates, merge) replies under it. Persist its ts on the PR body
      # so other runs/workflows can find the thread. (Editing the body doesn't re-trigger pr-gates,
      # which only fires on opened/synchronize/reopened.)
      - name: Slack — PR opened (thread root)
        id: root
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: info
          title: 'spec-sync ${{ env.SPEC_LABEL }}: new spec drift → PR opened'
          text: '<${{ steps.open_pr.outputs.url }}|Open the PR> — mechanical spec snapshot committed; wiring the SDK next. Human review required before merge.'

      - name: Save thread root on the PR
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.root.outputs.ts != ''
        continue-on-error: true # bookkeeping only; thread-ts.sh fails closed, and a hiccup must not red the run
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: ./scripts/spec-sync/thread-ts.sh set "${{ steps.open_pr.outputs.url }}" "${{ steps.root.outputs.ts }}"

      # ---- Phase 2: AI wiring — edits ONLY. The agent holds no shell/git-push capability, so a
      # prompt-injected spec description cannot route around review to push to a branch. ----
      - name: AI wiring (edits only)
        id: ai_wiring
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.SPEC_SYNC_TOKEN }}
          prompt: |
            The previous commit updated specs/v1-ade.json and regenerated reference types in
            specs/_generated/v1-ade.d.ts. Wire the SDK to match the spec diff. This is the V1
            surface (client.parse, client.extract, client.parseJobs, ...), NOT client.v2 — do not
            touch src/resources/v2/.

            First inspect the mechanical commit diff (`git diff HEAD~1..HEAD`) — the operation/path
            hunks AND changed entries under `components.schemas` — to find every change. Read
            src/resources/parse-jobs.ts and mirror its structure exactly for any new resource: the
            resource class and its methods (APIPromise return types, `this._client.get/post`), the
            param and response interfaces declared in the same file, and registration on the client
            (src/client.ts) plus re-export in src/resources/index.ts and src/index.ts. Add tests
            under tests/api-resources/ mirroring tests/api-resources/parse-jobs.test.ts, and update
            api.md and the README examples.

            Distinguish REQUEST fields — add a new OPTIONAL property to the method's params
            interface — from RESPONSE fields — add the field to the corresponding response
            interface. For a RESPONSE field, mirror the generated reference type in
            specs/_generated/v1-ade.d.ts EXACTLY: match its required-vs-optional and its
            nullability. A field the reference marks required (present, no trailing `?`) must be
            declared required — do NOT soften it to a `?`-optional; add `| null` only when the
            reference does. This holds whether you add a new field or wire a whole new response
            type. Declaring a NEW response field required is allowed and does NOT violate the
            additive rule below (that rule forbids only changing an EXISTING property to required).
            Types are camelCase on the wire-facing params where the existing code is
            (follow the neighbouring file exactly).

            You may only edit product code: src/, tests/, api.md, and README.md. Do NOT edit
            scripts/, .github/, specs/, etc/, or any dotfile or config.

            Additive-changes rule: BACKWARD-COMPATIBLE ADDITIONS ONLY. You MAY add a new optional
            property to a params interface. You must NOT remove or rename a public symbol or
            property, change a type, or make an existing property required; the surface-lock CI job
            will fail the PR on any of those. `git diff` (read-only, to inspect the change) is fine;
            do NOT stage, commit, push, or run any other git command — a later workflow step commits
            and pushes your edits.
          claude_args: |
            --max-turns 250
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git diff:*)"

      # The AI step has NO shell (only git diff), so it cannot itself execute anything with the
      # checkout's push credentials. But its Write tool is repo-wide, so before running the trusted
      # tools — and before the `git add -A` below — enforce the product-code ALLOWLIST: revert every
      # tracked edit and delete every untracked file OUTSIDE src/ tests/ api.md README.md. This stops
      # an injected edit to e.g. a config that defines what `format`/`build` run from executing here.
      #
      # The action STAGES its edits (git add) but does not commit. `git checkout -- .` restores the
      # working tree FROM THE INDEX, so a staged edit survives it — the revert must therefore unstage
      # first (`git reset -q`) so it sees every AI edit as a working-tree change and `git clean` sees
      # new files as untracked. Without the reset the allowlist is a no-op and non-product edits (a
      # config, a dotfile) reach `format`/`build` and the commit below.
      # (`git clean` has no -x, so gitignored paths like node_modules/ and dist/ are untouched.)
      #
      # Then format, build, and refresh the API report so the AI's additive surface is reflected in
      # etc/landingai-ade.api.md (the api-report gate would otherwise flag it as stale). If the AI's
      # code fails to build, this step fails and nothing is pushed — the PR keeps only the mechanical
      # commit and the red run signals a human to look, which is the safe outcome.
      - name: Restrict AI edits to product code, then format + refresh the API report
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git reset -q # unstage the action's edits so the allowlist revert + clean below actually apply
          git checkout -- . ':(exclude)src' ':(exclude)tests' ':(exclude)api.md' ':(exclude)README.md'
          git clean -fd -e /src -e /tests
          ./scripts/format
          ./scripts/build
          yarn api-extractor

      # Deterministic: commit whatever the AI edited (plus the refreshed report) and push. This is
      # the only step with push capability (the action's automation mode does not push).
      - name: Commit + push AI wiring
        id: ai_push
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "AI step produced no changes."
            echo "summary=Mechanical-only PR (AI wiring added no changes). Human review required before merge." >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat(spec-sync): wire SDK to spec diff (AI)"
            git push origin HEAD:"$SYNC_BRANCH"
            echo "summary=Mechanical snapshot + AI wiring committed. Gates must pass; human review required before merge." >> "$GITHUB_OUTPUT"
          fi

      # Rewrite the PR description: keep the static process/safety preamble from "Open sync PR" and
      # APPEND an LLM "## What changed" summary of the actual PR diff. Logic is shared by both jobs
      # in scripts/spec-sync/summarize-pr.sh. Best-effort — the static body stands if it degrades;
      # the script only edits the PR body via SPEC_SYNC_TOKEN, so an injected spec description in
      # the diff can't escalate past text.
      - name: Summarize the PR diff into the description
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        continue-on-error: true # a summary is nice-to-have; never red the run over it
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_TITLE_PREFIX: 'spec-sync(v1)' # LLM generates only the title summary after this prefix
        run: ./scripts/spec-sync/summarize-pr.sh "${{ steps.open_pr.outputs.url }}"

      # The AI-wiring outcome, as a reply under the PR-opened thread root (steps.root).
      - name: Slack — AI wiring result
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.root.outputs.ts != ''
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: info
          title: 'spec-sync ${{ env.SPEC_LABEL }}: AI wiring'
          text: ${{ steps.ai_push.outputs.summary }}
          thread_ts: ${{ steps.root.outputs.ts }}

      # Catch-all failure alert for this job. An unavailable spec source (exit 20) is skipped earlier
      # and never reaches here; what this calls out is a reachable source that errored — an HTTP error
      # status / empty / invalid spec, or a script error (exit not 0/10/20) — and an AI-wiring crash
      # (PR left mechanical-only), with a generic fallback.
      - name: Slack — spec-sync failed
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: failure
          title: 'spec-sync ${{ env.SPEC_LABEL }}: run failed'
          text: >-
            ${{ (steps.drift.outputs.code != '' && steps.drift.outputs.code != '0' && steps.drift.outputs.code != '10' && steps.drift.outputs.code != '20')
            && format('Spec fetch/normalize failed (exit {0}) — staging was reachable but returned an error status (401/403/5xx), an empty/invalid spec, or a script errored (an unbooked cluster 404s → exit 20, skipped, not alerted). Investigate.', steps.drift.outputs.code)
            || (steps.ai_wiring.outcome == 'failure'
            && 'AI wiring step failed. Any open sync PR has only the mechanical commit and needs manual wiring.'
            || 'spec-sync run failed. See the workflow run for details.') }}
            · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
          thread_ts: ${{ steps.root.outputs.ts }}

  # V2 loop. Same machinery as the V1 job above, pointed at the V2 spec on the AIDE gateway and a
  # separate sync branch, with a V2-tailored wiring prompt. Kept a distinct job (not a matrix) so the
  # proven V1 loop stays untouched and the two prompts can diverge freely.
  #
  # HOSTS (do not conflate): the V2 *spec* is published at aide.[env]/openapi.json; the V2 *API* (what
  # the SDK and contract tests call) is api.ade.[env]. We fetch drift from aide; the SDK never talks to
  # aide (its app routes are staff-SSO-gated). Routing is handled by the client's v2BaseURL.
  spec-sync-v2:
    if: github.repository == 'landing-ai/ade-typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # headroom for the AI wiring step (up to --max-turns 250) plus install/build
    env:
      V2_SPEC_URL: https://aide.staging.landing.ai/openapi.json # staging drives the loop
      SYNC_BRANCH: spec-sync/v2 # separate branch so V1 and V2 sync PRs never collide
      SPEC_LABEL: V2 # used only in Slack/PR-comment copy to disambiguate the two jobs
    steps:
      - uses: actions/checkout@v6
        with:
          # SPEC_SYNC_TOKEN (fine-grained PAT), NOT GITHUB_TOKEN: pushes/PRs authored by GITHUB_TOKEN
          # do not trigger the gate workflows (anti-recursion).
          token: ${{ secrets.SPEC_SYNC_TOKEN }}
          fetch-depth: 0 # tags needed for the surface-lock baseline

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Detect drift
        id: drift
        run: |
          set +e
          ./scripts/spec-sync/check-drift.sh "$V2_SPEC_URL" specs/v2-aide.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: No drift
        if: steps.drift.outputs.code == '0'
        run: echo "specs in sync; nothing to do."

      # An unavailable spec source (check-drift exit 20) is the EXPECTED case on staging, not an
      # incident: staging auto-reclaims and must be booked to come back — an unbooked cluster serves a
      # 404 (or the host stops answering entirely). Treat ONLY this as a no-op — log and end the run
      # cleanly (no drift, no PR, no Slack); the next hourly run picks up any drift once staging is
      # booked. Every other failure (a reachable source returning 401/403/5xx, an empty/invalid spec,
      # or a script error) falls through to "Fail on spec error" below and alerts.
      - name: Spec source unavailable — skip
        if: steps.drift.outputs.code == '20'
        run: echo "spec source unavailable (exit 20); staging is likely unbooked — skipping this run."

      # A reachable-but-invalid spec (empty/whitespace body, malformed JSON) or a script error is a
      # real problem — fail loudly so the catch-all alert fires. Distinct from the exit-20 skip above.
      - name: Fail on spec error
        if: steps.drift.outputs.code != '0' && steps.drift.outputs.code != '10' && steps.drift.outputs.code != '20'
        run: |
          echo "spec fetch/normalize failed (exit ${{ steps.drift.outputs.code }}); staging was reachable but returned an error status (401/403/5xx), an empty/invalid spec, or a script errored."
          exit 1

      - name: Check for an open sync PR
        id: existing
        if: steps.drift.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: |
          # Fail CLOSED (see the V1 job): a transient gh failure must abort the job, not silently
          # become open=false and force-push over an existing human-reviewed PR's branch.
          count="$(gh pr list --state open --head "$SYNC_BRANCH" --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      # A sync PR is already open. Every hourly tick still reports drift (check-drift compares against
      # main, not the PR branch), so instead of a bare skip: detect drift that appeared BEYOND the
      # open PR and, if any, annotate the PR + emit one Slack ping per distinct new spec (deduped).
      - name: New drift behind the open PR
        id: behind
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: ./scripts/spec-sync/notify-new-drift.sh specs/v2-aide.json "$SYNC_BRANCH" "$SPEC_LABEL"

      - name: Slack — new drift behind the open PR
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open == 'true' && steps.behind.outputs.notify == 'true'
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: warning
          title: 'spec-sync ${{ env.SPEC_LABEL }}: new drift behind the open PR'
          text: 'New ${{ env.SPEC_LABEL }} spec drift appeared beyond the <${{ steps.behind.outputs.pr_url }}|open sync PR> (live-spec `${{ steps.behind.outputs.hash }}`). Merge or close it and the next run opens a fresh one covering the rest.'
          thread_ts: ${{ steps.behind.outputs.thread_ts }}

      # ---- Phase 1: mechanical (deterministic) ----
      - name: Mechanical commit + push
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git config user.name "spec-sync[bot]"
          git config user.email "spec-sync@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          ./scripts/spec-sync/gen-models.sh specs/v2-aide.json specs/_generated/v2-aide.d.ts
          git add specs/v2-aide.json specs/_generated/v2-aide.d.ts
          git commit -m "chore(spec-sync): update V2 spec snapshot + regenerated reference types"
          git push --force origin "$SYNC_BRANCH"

      - name: Open sync PR
        id: open_pr
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: |
          url="$(gh pr create --base main --head "$SYNC_BRANCH" \
            --title "spec-sync: track V2 spec drift" \
            --body $'Automated V2 spec-sync PR (`client.v2`).\n\n- **Commit 1 (mechanical):** normalized V2 spec snapshot + regenerated reference types.\n- **Commit 2 (AI, only if the spec diff needs SDK changes):** client.v2 resources/methods/tests/docs wired from the diff. The shipped-but-hand-maintained `/v2/workflow*` surface is not auto-wired, so workflow-only drift lands as a **mechanical-only PR** for a maintainer to reconcile by hand.\n\nGates (surface-lock, V2 contract tests, lint/build/test) must pass. The V2 ergonomic layer (unified Job, dual-host, schema coercion) is not in the spec, so when present the AI commit is a **draft a human finishes**. **Human review required before merge.**')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Post the Slack thread ROOT now — right after the PR exists, before AI wiring — so every later
      # event (AI outcome, new drift, gates, merge) replies under it. Persist its ts on the PR body
      # so other runs/workflows can find the thread. (Editing the body doesn't re-trigger pr-gates,
      # which only fires on opened/synchronize/reopened.)
      - name: Slack — PR opened (thread root)
        id: root
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: info
          title: 'spec-sync ${{ env.SPEC_LABEL }}: new spec drift → PR opened'
          text: '<${{ steps.open_pr.outputs.url }}|Open the PR> — mechanical spec snapshot committed; wiring the SDK next. Human review required before merge.'

      - name: Save thread root on the PR
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.root.outputs.ts != ''
        continue-on-error: true # bookkeeping only; thread-ts.sh fails closed, and a hiccup must not red the run
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: ./scripts/spec-sync/thread-ts.sh set "${{ steps.open_pr.outputs.url }}" "${{ steps.root.outputs.ts }}"

      # ---- Everything the AI pass may see or reach is decided HERE, in a trusted step --------
      #
      # 1. Precompute the mechanical diff. The agent needs it, but must not run `git diff` to get
      #    it: git honours `diff.external` / textconv drivers from .git/config, so an agent that
      #    can write .git/config turns a "read-only" git diff into arbitrary execution INSIDE its
      #    own step — before any allowlist or hardening runs. Handing it a plain file keeps the
      #    input and removes the primitive. (Untracked and not in the `git clean` exclusions, so
      #    the allowlist step deletes it before anything is committed.)
      #
      # 2. Take the push credential away BEFORE the agent runs, not after. actions/checkout
      #    persists it in .git/config; nothing between here and the explicit push needs it, so
      #    even a successful in-step escape has no token to reach. Snapshot the now-clean config
      #    so each post-AI restore can put it back wholesale, rather than unsetting known-bad keys
      #    one at a time — an agent can add `filter.*.clean`, `diff.external`, aliases, and any
      #    enumeration of those will be incomplete.
      #
      # 3. Drop .git/hooks and .git/info. Neither is a worktree path, so neither `git checkout`
      #    nor `git clean` restores them: a planted pre-commit hook runs on our own `git commit`,
      #    and one line in .git/info/exclude makes `git clean -fd` skip the agent's own file —
      #    walking it straight past the product-code allowlist.
      - name: Precompute the spec diff and harden the checkout
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git diff HEAD~1..HEAD > .spec-sync-diff.txt
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.hooksPath || true
          rm -rf .git/hooks .git/info
          # $RUNNER_TEMP is outside GITHUB_WORKSPACE, so the `git clean` in the allowlist steps
          # cannot delete this snapshot before the repair path needs it a second time.
          cp .git/config "$RUNNER_TEMP/git-config.trusted"

      # ---- Phase 2: AI wiring — edits ONLY (no shell/git-push; a later step commits). ----
      - name: AI wiring (edits only)
        id: ai_wiring
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.SPEC_SYNC_TOKEN }}
          prompt: |
            The previous commit updated specs/v2-aide.json and regenerated reference types in
            specs/_generated/v2-aide.d.ts. Wire the client.v2 SDK to match the spec diff. This is the
            V2 surface (client.v2.*), NOT V1 — do not touch V1 resources.

            OUT OF SCOPE — do NOT wire: /v2/workflow, /v2/workflow/jobs, and
            /v2/workflow/jobs/{job_id}. That surface IS shipped (client.v2.workflow / workflowJobs)
            but is hand-maintained and NOT auto-wired by spec-sync; a maintainer reconciles workflow
            spec drift by hand. Skip it entirely even though it appears in the spec and reference
            types. If the spec diff touches only workflow, make no changes.

            First read the ENTIRE mechanical commit diff, which a trusted step has already written
            to `.spec-sync-diff.txt` in the repo root (you have no shell — use Read, do not try to
            run git) — the
            operation/path hunks AND changed entries under `components.schemas`. A response-field
            addition often changes ONLY a component schema (e.g. /v2/parse references ParseResponse)
            and its generated type, not the operation hunk, so for every changed schema trace its
            `$ref` consumers to the non-workflow operations that use it. Cover: (a) newly added /v2
            routes; (b) field or schema changes on existing operations, INCLUDING component-only
            changes; (c) changes to /v1/files, which backs client.v2.files (src/resources/v2/files.ts).

            Distinguish REQUEST fields — wire as a new optional property on the method's params
            interface — from RESPONSE-model fields — add the field to the corresponding response type
            under src/resources/v2/types.ts. For a RESPONSE field, mirror the generated reference
            type in specs/_generated/v2-aide.d.ts EXACTLY: match its required-vs-optional and its
            nullability. A field the reference marks required (present, no trailing `?`) must be
            declared required — do NOT soften it to a `?`-optional; add `| null` only when the
            reference does. This holds whether you add a new field or wire a whole new response
            type. Declaring a NEW response field required is allowed and does NOT violate the
            additive rule below (that rule forbids only changing an EXISTING property to required).
            For a genuinely new route, read
            src/resources/v2/extract.ts and src/resources/v2/parse.ts and mirror their structure:

            - Add a resource module under src/resources/v2/ with a sync method (multipart or JSON per
              the spec; a 504 must route through the V2SyncTimeoutError mapping the neighbours use) and,
              for an async route, a *Jobs resource with create / get / wait / list.
            - Register it on the V2 container in src/resources/v2/v2.ts exactly as parse/extract are
              wired, and export types through src/resources/v2/index.ts and src/index.ts as the
              neighbours do.
            - Normalize any async job into the unified Job (the Job type in src/resources/v2/types.ts)
              by adding a normalizer in src/resources/v2/_normalize.ts, mirroring normalizeParseJob /
              normalizeExtractJob (tolerant status; map the envelope's result / error / timestamps).
            - If a method accepts a JSON Schema, coerce it via coerceSchema from lib/schema.
            - Build request URLs via the V2 base-URL routing the neighbours use (never hardcode a
              host — the SDK calls api.ade.[env], never aide; routing is automatic via v2BaseURL).

            Read a property's shape from the schema, never from the prose, and derive its two
            dimensions INDEPENDENTLY:
            (a) Optional (may the key be absent?) — yes iff the property is absent from that
                schema's `required` array. Optional means `name?: T`; required means `name: T`.
                A property can be described as "always present for model X" and still be optional;
                trust `required`, not the `description`.
            (b) Nullable (may the value be null?) — yes ONLY if that property's own schema says so
                (`type: [..., 'null']`, an `anyOf` branch with `type: 'null'`, or `nullable: true`).
                Do NOT infer nullability from being absent from `required` — the two are unrelated,
                and adding a spurious `| null` widens the public type for every caller. Existing
                optional-but-not-nullable examples to match: `range_units?: 'unicode_codepoints'`
                and `openapi_spec?: string`.
            So: optional and nullable is `name?: T | null`; optional only is `name?: T`; required and
            nullable is `name: T | null`. Whatever the declaration, compare with `== null` / `!= null`
            rather than `=== null`, so an absent key and an explicit null are handled alike — the
            gateway omits optional fields rather than sending null, and a `=== null` check silently
            misses that, the common case. In the doc comment for an optional field say
            "omitted"/"absent" rather than "null" unless the schema really does allow null.

            Add a live check to tests/contract/v2-smoke.test.ts and unit tests under
            tests/api-resources/v2/. The contract file hits LIVE staging, so it must assert only
            what staging is guaranteed to return: NEVER pin `model:` there (a model family the spec
            documents may be unserved on staging — `dpt-3-fast` is accepted but never answered, and
            a test pinning it hangs until the gate times out), and for an optional property assert
            absent-or-valid ("if present, it is in range"), never that it is populated. Assertions
            on a specific value belong in the mocked unit tests under tests/api-resources/v2/, where
            you control the response body — put them there instead. Build the client with the
            file's existing `stagingClient()` helper rather than calling `new LandingAIADE(...)`
            yourself, and give the test a per-test timeout consistent with its neighbours.

            Update api.md and the README examples.

            You may only edit product code: src/, tests/, api.md, and README.md. Do NOT edit scripts/,
            .github/, specs/, etc/, or any dotfile or config.

            Additive-changes rule: BACKWARD-COMPATIBLE ADDITIONS ONLY. You MAY add a new optional
            property to a params interface. You must NOT remove or rename a public symbol or property,
            change a type, or make an existing property required; surface-lock will fail the PR on any
            of those. You have NO shell and no git access at all; the diff you need is already in
            `.spec-sync-diff.txt`. A later workflow step commits and pushes your edits.
          # NO Bash tool. `Bash(git diff:*)` was allowed here so the agent could inspect the
          # mechanical diff, but `git diff` is NOT inert: an agent that writes .git/config can point
          # `diff.external` (or a textconv driver) at a script it also wrote, and the permitted
          # `git diff` then EXECUTES it — inside the AI step, before any allowlist or hardening
          # applies. A trusted step precomputes the diff into .spec-sync-diff.txt instead, so the
          # agent keeps the input and loses the execution primitive.
          claude_args: |
            --max-turns 250
            --allowedTools "Edit,Write,Read,Glob,Grep"

      # ---- Harden before running ANY trusted command over the AI's edits --------------------
      #
      # The AI step has no shell, so it cannot execute anything ITSELF. But the allowlist revert
      # below is not a complete boundary: `git checkout` only restores TRACKED files and
      # `git clean -fd` (no -x) only deletes untracked, non-ignored ones. Two repo-wide Write
      # targets survive both — and the trusted steps that follow EXECUTE both:
      #   * node_modules/** — gitignored, so never cleaned; eslint/tsc/tsc-multi and every
      #                       scripts/utils/*.cjs helper run out of it.
      #   * .git/**         — not a worktree path at all; `.git/hooks/pre-commit` would run on our
      #                       own `git commit`, and `core.hooksPath` can redirect hooks anywhere.
      # On top of that, `./scripts/build` in the next step ends with
      # `node -e 'require("landingai-ade")'` smoke probes, so it executes the AI's own src/ by
      # design. Either path turns "the AI wrote a file" into "code runs in a trusted step".
      #
      # So do two things first: drop the push credential actions/checkout persisted into
      # .git/config (nothing executed downstream can reach a token that is not there — the
      # AI-wiring push below re-supplies it explicitly for that one command), and neutralize the
      # hook paths so our own git commands cannot run anything.
      #
      # This narrows the blast radius; it does not make executing AI-authored code safe. Full
      # isolation — run the AI pass in a credential-free checkout and copy only the validated
      # allowlist diff back — is the real fix and is deliberately NOT attempted here.
      - name: Restore trusted git metadata after the AI pass
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          cp "$RUNNER_TEMP/git-config.trusted" .git/config
          rm -rf .git/hooks .git/info

      # See the V1 job's copy of this step for why: the action stages its edits, so `git checkout`
      # (which restores from the index) is a no-op on them — unstage with `git reset -q` first so the
      # product-code allowlist revert + clean actually apply before format/build run.
      - name: Restrict AI edits to product code, then format + refresh the API report
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        run: |
          git reset -q # unstage the action's edits so the allowlist revert + clean below actually apply
          git checkout -- . ':(exclude)src' ':(exclude)tests' ':(exclude)api.md' ':(exclude)README.md'
          git clean -fd -e /src -e /tests
          # A .gitattributes INSIDE the allowlist survives the two lines above and can bind content
          # filters / diff drivers to paths. The config half of that attack is already gone (the
          # restore step above replaces .git/config wholesale), but remove the file half too. This
          # repo tracks no .gitattributes anywhere, so deleting any that appeared is always safe.
          find src tests -name .gitattributes -delete 2>/dev/null || true
          ./scripts/format
          ./scripts/build
          yarn api-extractor

      # ---------------------------------------------------------------------------------------
      # Verify the AI wiring, then give it ONE chance to fix itself.
      #
      # The wiring step has no shell, so nothing has type-checked its output: the step above only
      # formats and rebuilds. Historically that meant every AI mistake `./scripts/lint` can see
      # (eslint/prettier violations, a tsc error, a wrong type declaration) landed as a red `lint`
      # job on a PR that otherwise looked review-ready. So run the real lint HERE, in a trusted
      # step, and hand its output back to a second shell-less Claude pass.
      #
      # This closes the loop WITHOUT granting the AI a shell: its edits are still funnelled through
      # the product-code allowlist below before they can reach a commit, and the lint log it reads is
      # eslint/tsc output quoting its own just-written code — no new trust boundary is crossed by
      # feeding it back.
      #
      # Deliberately a STATIC SUBSET, not `./scripts/lint`: that script calls `./scripts/build`, which
      # ends in `node -e 'require("landingai-ade")'` / `import(...)` smoke probes — i.e. it EXECUTES
      # the AI's freshly written src/ in a trusted step still holding the checkout's SPEC_SYNC_TOKEN.
      # (That execution is pre-existing: the restrict+build step above already does it, so this is not
      # a boundary this loop introduces — but there is no reason to repeat it.) eslint and `tsc
      # --noEmit` only ever READ the source, and between them they cover every class of mistake the
      # wiring pass can make in src/ tests/. The rest of `./scripts/lint` (attw, publint) validates
      # packaging config the AI is not allowed to touch, and CI's own `lint` job still runs the whole
      # script on the PR with no push credentials.
      #
      # eslint is scoped to `src tests`, not `.`, because this runs AFTER the build above: a bare
      # `eslint .` also walks the freshly generated `dist/` (the flat config's `dist/` entry sits on a
      # config object, so it does not ignore those files globally) and reports ~20
      # no-restricted-imports errors in build output on EVERY run — which would fail the loop, burn a
      # pointless repair pass, and mark every PR "lint still fails" over generated code the allowlist
      # forbids the AI from touching. `src tests` is exactly the TypeScript the wiring pass may edit.
      # CI's own `lint` job is unaffected: there eslint runs before the build, so no dist exists yet.
      # `tsc --noEmit` needs no scoping — tsconfig.json already excludes dist.
      - name: Lint the AI wiring
        id: ai_lint
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        # A lint failure here is the normal case this loop exists to handle, not a run failure.
        continue-on-error: true
        run: |
          set -o pipefail
          # Run both even if the first fails, so the repair pass sees every error at once.
          status=0
          ./node_modules/.bin/eslint src tests 2>&1 | tee .spec-sync-lint.log || status=1
          ./node_modules/typescript/bin/tsc --noEmit 2>&1 | tee -a .spec-sync-lint.log || status=1
          exit $status

      - name: AI lint repair (edits only)
        id: ai_lint_fix
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.ai_lint.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.SPEC_SYNC_TOKEN }}
          prompt: |
            `./scripts/lint` failed on the client.v2 wiring you just wrote. Read
            .spec-sync-lint.log in the repo root — it is the captured output of that run (eslint
            with prettier, then a build, then `tsc`, then attw/publint) — and fix every error it
            reports.

            Fix the CAUSE, not the symptom. Specifically, do NOT silence anything: no
            `@ts-ignore` / `@ts-expect-error`, no `eslint-disable`, no `as any` / `as unknown as X`
            to force a type through, no widening a declared type to `any`, and no deleting the
            assertion or test that tripped the error. If a type is wrong, correct the declaration
            in src/resources/v2/types.ts to match the spec snapshot (checking the schema's
            `required` array for whether a property is optional). Keep the behavior the wiring was
            written to have.

            You may only edit src/, tests/, api.md, and README.md — the same allowlist as before.
            Do NOT edit scripts/, .github/, specs/, etc/, package.json, or any dotfile or config
            (including .spec-sync-lint.log itself: it is an input, and it is deleted before
            anything is committed). You have NO shell and no git access at all.
          # NO Bash tool — see the wiring step above for why `Bash(git diff:*)` was removed.
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep"

      # The repair pass is exactly as untrusted as the wiring pass, so repeat the hardening too: it
      # could have written node_modules/** or .git/hooks/** just as the wiring pass could, and the
      # format/build/re-lint/commit steps below execute both. (The credential unset is already done
      # and idempotent; the hooks removal matters because a repair pass could recreate them.)
      - name: Restore trusted git metadata after the repair pass
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.ai_lint.outcome == 'failure'
        run: |
          cp "$RUNNER_TEMP/git-config.trusted" .git/config
          rm -rf .git/hooks .git/info

      # Re-apply the allowlist before formatting or committing, and refresh the API report in case
      # the repair changed a public type. This also deletes .spec-sync-lint.log (untracked, not in
      # the `git clean` exclusions), so the log never reaches the commit.
      - name: Re-restrict AI edits to product code, then format + refresh the API report
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.ai_lint.outcome == 'failure'
        run: |
          git reset -q # unstage the action's edits so the allowlist revert + clean below actually apply
          git checkout -- . ':(exclude)src' ':(exclude)tests' ':(exclude)api.md' ':(exclude)README.md'
          git clean -fd -e /src -e /tests
          # A .gitattributes INSIDE the allowlist survives the two lines above and can bind content
          # filters / diff drivers to paths. The config half of that attack is already gone (the
          # restore step above replaces .git/config wholesale), but remove the file half too. This
          # repo tracks no .gitattributes anywhere, so deleting any that appeared is always safe.
          find src tests -name .gitattributes -delete 2>/dev/null || true
          ./scripts/format
          ./scripts/build
          yarn api-extractor

      # Record whether the repair actually worked, so the Slack reply and the PR say so honestly
      # instead of implying the wiring is clean when CI is about to go red.
      - name: Re-lint after repair
        id: ai_lint_final
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.ai_lint.outcome == 'failure'
        continue-on-error: true
        # Same static subset as the first pass — see there for why the full script is not used.
        run: |
          status=0
          ./node_modules/.bin/eslint src tests || status=1
          ./node_modules/typescript/bin/tsc --noEmit || status=1
          exit $status

      # Commit and push are SEPARATE steps, and the token appears only in the push step's env.
      # `git add` runs content filters (`filter.<driver>.clean`), which an AI pass can install via
      # .git/config plus a .gitattributes inside the allowlist — the restore step above removes the
      # config half and the allowlist step the file half, and keeping the token out of this step's
      # environment means even a filter that somehow survived both has nothing to read. By the time
      # the push step runs, staging and committing are done and no AI-authored content executes again.
      - name: Commit AI wiring
        id: ai_commit
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        env:
          LINT_FIRST: ${{ steps.ai_lint.outcome }}
          LINT_FINAL: ${{ steps.ai_lint_final.outcome }}   # 'skipped' when the first lint passed
        run: |
          if [ "$LINT_FIRST" = 'success' ]; then
            lint_note='Lint clean.'
          elif [ "$LINT_FINAL" = 'success' ]; then
            lint_note='Lint failed on the first pass; the AI repair pass fixed it.'
          else
            lint_note='LINT STILL FAILS after the AI repair pass — the CI lint job will be red and needs a manual fix.'
          fi
          # Unconditionally, BEFORE `git add -A`: these are untracked and not gitignored, and the
          # re-restrict step that would have cleaned them only runs on the repair path. On the
          # common clean-lint path they would otherwise be committed — and on a no-op wiring run
          # they would be the ONLY staged change, turning "the AI changed nothing" into a bogus
          # wiring commit.
          rm -f .spec-sync-lint.log .spec-sync-diff.txt
          git add -A
          if git diff --cached --quiet; then
            echo "AI step produced no changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "summary=Mechanical-only PR (AI wiring added no changes — e.g. workflow-only drift). Human review required before merge." >> "$GITHUB_OUTPUT"
          else
            # --no-verify belts-and-braces on top of removing .git/hooks above.
            git commit --no-verify -m "feat(spec-sync): wire client.v2 to spec diff (AI)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Mechanical snapshot + AI wiring committed (a draft a human finishes). ${lint_note} Gates must pass; human review required before merge." >> "$GITHUB_OUTPUT"
          fi

      # The only step that sees the token, and it runs exactly one command over an already-built
      # commit. The credential was stripped from .git/config before the AI ever ran, so it is
      # supplied inline here rather than via the checkout's persisted config. GitHub masks it.
      - name: Push AI wiring
        id: ai_push
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.ai_commit.outputs.changed == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
        run: git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$SYNC_BRANCH"

      # Rewrite the PR description: keep the static process/safety preamble from "Open sync PR" and
      # APPEND an LLM "## What changed" summary of the actual PR diff. Logic is shared by both jobs
      # in scripts/spec-sync/summarize-pr.sh. Best-effort — the static body stands if it degrades;
      # the script only edits the PR body via SPEC_SYNC_TOKEN, so an injected spec description in
      # the diff can't escalate past text.
      - name: Summarize the PR diff into the description
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true'
        continue-on-error: true # a summary is nice-to-have; never red the run over it
        env:
          GH_TOKEN: ${{ secrets.SPEC_SYNC_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_TITLE_PREFIX: 'spec-sync(v2)' # LLM generates only the title summary after this prefix
          # spec-sync does not auto-wire /v2/workflow* (it's shipped but hand-maintained; see the
          # AI-wiring prompt above), so keep it out of "What changed" — else a workflow-only drift
          # would describe SDK changes this PR did not make.
          SUMMARY_SCOPE_NOTE: 'Scope: spec-sync does NOT auto-wire /v2/workflow, /v2/workflow/jobs, or /v2/workflow/jobs/{job_id}. That surface exists in the client (client.v2.workflow / client.v2.workflowJobs) but is hand-maintained and reconciled separately, so this PR does not change it. Do not describe any /v2/workflow* route as a change in this PR; if the diff touches only workflow, say the spec snapshot was updated but no client surface changed in this PR.'
        run: ./scripts/spec-sync/summarize-pr.sh "${{ steps.open_pr.outputs.url }}"

      # The AI-wiring outcome, as a reply under the PR-opened thread root (steps.root).
      - name: Slack — AI wiring result
        if: steps.drift.outputs.code == '10' && steps.existing.outputs.open != 'true' && steps.root.outputs.ts != ''
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: info
          title: 'spec-sync ${{ env.SPEC_LABEL }}: AI wiring'
          text: ${{ steps.ai_commit.outputs.summary }}
          thread_ts: ${{ steps.root.outputs.ts }}

      # Catch-all failure alert for this job. An unavailable spec source (exit 20) is skipped earlier
      # and never reaches here; what this calls out is a reachable source that errored — an HTTP error
      # status / empty / invalid spec, or a script error (exit not 0/10/20) — and an AI-wiring crash
      # (PR left mechanical-only), with a generic fallback.
      - name: Slack — spec-sync failed
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          webhook: ${{ secrets.SLACK_SPEC_SYNC_WEBHOOK }}
          status: failure
          title: 'spec-sync ${{ env.SPEC_LABEL }}: run failed'
          text: >-
            ${{ (steps.drift.outputs.code != '' && steps.drift.outputs.code != '0' && steps.drift.outputs.code != '10' && steps.drift.outputs.code != '20')
            && format('Spec fetch/normalize failed (exit {0}) — staging was reachable but returned an error status (401/403/5xx), an empty/invalid spec, or a script errored (an unbooked cluster 404s → exit 20, skipped, not alerted). Investigate.', steps.drift.outputs.code)
            || (steps.ai_wiring.outcome == 'failure'
            && 'AI wiring step failed. Any open sync PR has only the mechanical commit and needs manual wiring.'
            || 'spec-sync run failed. See the workflow run for details.') }}
            · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
          thread_ts: ${{ steps.root.outputs.ts }}
