# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason;
# choose the release's v* tag (not a branch) in "Use workflow from", or the job is skipped.
# You can run this workflow by navigating to https://www.github.com/landing-ai/ade-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.'
        required: true

  release:
    types: [published]

# One release at a time; never cancel a publish midway.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Also enforced by the environment; this catches a run from another ref
    # if that setting ever changes.
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated: deploys only from a v* tag, after a required reviewer approves.
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            # The inner quotes must survive into the payload as literal \" —
            # paths_released is a JSON string containing JSON, like the else
            # branch. Unescaped quotes make the payload unparseable.
            PATHS_RELEASED="[\\\"$INPUT_PATH\\\"]"
          else
            PATHS_RELEASED='[\".\"]'
          fi
          yarn tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
